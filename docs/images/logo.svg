<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Squircle container clipping mask -->
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Electric Cyan Gradient for Optics & Broadcast Telemetry -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm Amber Gradient for Titanium Beak -->
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Obsidian & Slate Armor Facet Gradients -->
    <linearGradient id="slate-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="slate-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="slate-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="slate-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="slate-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Floating Depth -->
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#090d16" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-410
        355,-205
        355,205
        0,410
        -355,205
        -355,-205
      " fill="none" stroke="#0f172a" stroke-width="42" stroke-linejoin="round" />

      <!-- Inner Precision Telemetry Dashed Hexagon -->
      <polygon points="
        0,-375
        324,-187
        324,187
        0,375
        -324,187
        -324,-187
      " fill="none" stroke="url(#cyan-glow)" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Broadcast Concentric Radar Waves (Negative Space Telemetry) -->
      <path d="M -180,-300 A 350 350 0 0 1 180,-300" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.25" stroke-dasharray="8, 8" />
      <path d="M -130,-330 A 350 350 0 0 1 130,-330" fill="none" stroke="#00f5ff" stroke-width="2.5" opacity="0.35" />

      <!-- 100% Watertight Solid Base Silhouette (Zero-Leak Rule) -->
      <path d="
        M 0,-345
        L 35,-295 L 75,-315 L 65,-250 L 130,-265 L 105,-195 L 180,-190 L 140,-120
        L 260,-40 L 295,70 L 270,185 L 195,280 L 120,340 L 0,365
        L -120,340 L -195,280 L -270,185 L -295,70 L -260,-40
        L -140,-120 L -180,-190 L -105,-195 L -130,-265 L -65,-250 L -75,-315 L -35,-295
        Z
      " fill="#080c14" />

      <!-- ================= SWEEPING AERODYNAMIC WINGS ================= -->
      <!-- Left Primary Scapular & Wing Flight Blades -->
      <polygon points="-260,-40 -295,70 -220,95 -140,-120" fill="url(#slate-deep)" />
      <polygon points="-295,70 -270,185 -180,180 -220,95" fill="url(#slate-dark)" />
      <polygon points="-270,185 -195,280 -120,240 -180,180" fill="url(#slate-mid)" />

      <!-- Right Primary Scapular & Wing Flight Blades -->
      <polygon points="260,-40 295,70 220,95 140,-120" fill="url(#slate-deep)" />
      <polygon points="295,70 270,185 180,180 220,95" fill="url(#slate-dark)" />
      <polygon points="270,185 195,280 120,240 180,180" fill="url(#slate-mid)" />

      <!-- Tail Feathers & Keel Base -->
      <polygon points="-195,280 -120,340 0,365 -45,290 -120,240" fill="url(#slate-dark)" />
      <polygon points="195,280 120,340 0,365 45,290 120,240" fill="url(#slate-dark)" />
      <polygon points="-45,290 0,365 45,290 0,260" fill="url(#slate-deep)" />

      <!-- ================= HEAD CROWN & CREST ANTENNA ================= -->
      <!-- Center Crown Spire -->
      <polygon points="0,-345 28,-285 0,-265 -28,-285" fill="url(#slate-light)" />
      <!-- Left Crown Spire -->
      <polygon points="-28,-285 0,-265 -50,-240 -75,-315 -65,-250" fill="url(#slate-mid)" />
      <!-- Right Crown Spire -->
      <polygon points="28,-285 0,-265 50,-240 75,-315 65,-250" fill="url(#slate-mid)" />

      <!-- Outer Crest Blades -->
      <polygon points="-65,-250 -50,-240 -95,-185 -130,-265" fill="url(#slate-dark)" />
      <polygon points="65,-250 50,-240 95,-185 130,-265" fill="url(#slate-dark)" />

      <!-- Forehead Central Plate -->
      <polygon points="0,-265 50,-240 0,-180 -50,-240" fill="url(#slate-highlight)" />

      <!-- Supraorbital Brow Ridges -->
      <polygon points="-50,-240 0,-180 -60,-165 -95,-185" fill="url(#slate-light)" />
      <polygon points="50,-240 0,-180 60,-165 95,-185" fill="url(#slate-light)" />

      <!-- Auricular / Cheek Plates -->
      <polygon points="-95,-185 -60,-165 -115,-115 -140,-120 -180,-190 -105,-195" fill="url(#slate-dark)" />
      <polygon points="95,-185 60,-165 115,-115 140,-120 180,-190 105,-195" fill="url(#slate-dark)" />

      <!-- ================= ELECTRIC CYAN OPTICS (PREDATOR GAZE) ================= -->
      <!-- Left Eye Socket -->
      <polygon points="-60,-165 -115,-145 -75,-120 -20,-140" fill="#04060c" />
      <!-- Left Eye Iris (Sleek Almond Angle) -->
      <polygon points="-105,-145 -62,-158 -28,-142 -72,-126" fill="url(#cyan-glow)" />
      <!-- Left Eye Slit Pupil -->
      <polygon points="-72,-152 -62,-147 -66,-133 -74,-135" fill="#ffffff" />

      <!-- Right Eye Socket -->
      <polygon points="60,-165 115,-145 75,-120 20,-140" fill="#04060c" />
      <!-- Right Eye Iris (Sleek Almond Angle) -->
      <polygon points="105,-145 62,-158 28,-142 72,-126" fill="url(#cyan-glow)" />
      <!-- Right Eye Slit Pupil -->
      <polygon points="72,-152 62,-147 66,-133 74,-135" fill="#ffffff" />

      <!-- Eye Brow Highlights -->
      <polygon points="-62,-160 -28,-144 -44,-148" fill="#00f5ff" opacity="0.85" />
      <polygon points="62,-160 28,-144 44,-148" fill="#00f5ff" opacity="0.85" />

      <!-- ================= NASAL BRIDGE & RAZOR RAPTOR BEAK ================= -->
      <!-- Upper Nasal Keel -->
      <polygon points="0,-180 20,-140 0,-115 -20,-140" fill="url(#slate-highlight)" />

      <!-- Beak Base Bridge -->
      <polygon points="-20,-140 0,-115 0,-40 -30,-85" fill="url(#amber-accent)" />
      <polygon points="20,-140 0,-115 0,-40 30,-85" fill="#f59e0b" />

      <!-- Razor Beak Hook (Predatory Downward Curve) -->
      <polygon points="0,-115 14,-50 0,35 -14,-50" fill="url(#amber-accent)" />
      <polygon points="0,35 0,-40 14,-50" fill="#b45309" />
      <polygon points="0,35 0,-40 -14,-50" fill="#d97706" />

      <!-- Malar Cheek Facets (Under Eye) -->
      <polygon points="-75,-120 -20,-140 -30,-85 -75,-50 -115,-115" fill="url(#slate-mid)" />
      <polygon points="75,-120 20,-140 30,-85 75,-50 115,-115" fill="url(#slate-mid)" />

      <!-- Throat Flanks -->
      <polygon points="-30,-85 0,-40 0,55 -55,35 -75,-50" fill="url(#slate-dark)" />
      <polygon points="30,-85 0,-40 0,55 55,35 75,-50" fill="url(#slate-dark)" />

      <!-- ================= BREASTPLATE & TELEMETRY CORE ================= -->
      <!-- Central Pectoral Keel -->
      <polygon points="0,55 55,35 0,175 -55,35" fill="url(#slate-mid)" />

      <!-- Chest Telemetry Diamond (Broadcast Core) -->
      <polygon points="0,85 30,125 0,165 -30,125" fill="#080c14" stroke="url(#cyan-glow)" stroke-width="3" />
      <polygon points="0,98 18,125 0,152 -18,125" fill="url(#cyan-glow)" />
      <circle cx="0" cy="125" r="4.5" fill="#ffffff" />

      <!-- Lateral Breastplate Armor -->
      <polygon points="-55,35 0,175 -55,235 -130,155 -115,-115 -75,-50" fill="url(#slate-dark)" />
      <polygon points="55,35 0,175 55,235 130,155 115,-115 75,-50" fill="url(#slate-dark)" />

      <polygon points="-130,155 -55,235 -105,245 -150,185 -220,95" fill="url(#slate-deep)" />
      <polygon points="130,155 55,235 105,245 150,185 220,95" fill="url(#slate-deep)" />

      <!-- Abdominal Armor Plate -->
      <polygon points="0,175 55,235 0,280 -55,235" fill="url(#slate-light)" />
      <polygon points="0,280 40,295 0,330 -40,295" fill="url(#slate-mid)" />

      <!-- Subtle Electric Cyan Status Indicator Node on Crest -->
      <circle cx="0" cy="-345" r="8" fill="#00f5ff" />
      <circle cx="0" cy="-345" r="4" fill="#ffffff" />

    </g>
  </g>
</svg>